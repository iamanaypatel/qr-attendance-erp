{% extends "base.html" %}

{% block title %}Change Password — QR Attendance ERP{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="glass-card p-4 p-md-5">
        <h4 class="fw-bold brand-font mb-2">Change Password</h4>
        <p class="text-muted small mb-4">Ensure your account is using a strong, unique password.</p>

        <form method="POST" action="{{ url_for('auth.change_password') }}">
          {{ form.hidden_tag() if form else '' }}

          <div class="mb-3">
            <label class="form-label small fw-semibold text-muted">CURRENT PASSWORD</label>
            <input type="password" name="current_password" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold text-muted">NEW PASSWORD</label>
            <input type="password" name="new_password" class="form-control" required minlength="6">
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold text-muted">CONFIRM NEW PASSWORD</label>
            <input type="password" name="confirm_password" class="form-control" required minlength="6">
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary-glow flex-grow-1">Update Password</button>
            <a href="/" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
