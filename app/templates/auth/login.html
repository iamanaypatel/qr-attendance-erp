{% extends "base.html" %}

{% block title %}Sign In — QR Attendance ERP{% endblock %}

{% block content %}
<div class="container py-4 py-md-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
      
      <!-- Login Card -->
      <div class="glass-card p-4 p-md-5">
        
        <!-- Header -->
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-4 shadow-sm mb-3" style="width: 58px; height: 58px;">
            <i class="bi bi-qr-code-scan fs-2"></i>
          </div>
          <h3 class="fw-bold brand-font mb-1">Apex Attendance ERP</h3>
          <p class="text-muted" style="font-size: 0.9rem;">Sign in to access your dashboard</p>
        </div>

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
          {{ form.hidden_tag() if form else '' }}

          <div class="mb-3">
            <label for="identity" class="form-label fw-semibold small text-muted">USERNAME OR EMAIL</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0 text-muted">
                <i class="bi bi-person"></i>
              </span>
              <input type="text" class="form-control border-start-0 ps-0" id="identity" name="identity" placeholder="e.g. admin or admin@erp.local" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label for="password" class="form-label fw-semibold small text-muted mb-0">PASSWORD</label>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0 text-muted">
                <i class="bi bi-shield-lock"></i>
              </span>
              <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" name="password" placeholder="••••••••" required>
              <button class="input-group-text bg-transparent border-start-0 text-muted" type="button" id="togglePasswordBtn" title="Show/Hide Password">
                <i class="bi bi-eye" id="togglePasswordIcon"></i>
              </button>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember_me" name="remember_me" value="y">
              <label class="form-check-label small text-muted" for="remember_me">
                Remember me
              </label>
            </div>
            <span class="small text-muted"><i class="bi bi-shield-check text-success"></i> 256-bit Encrypted</span>
          </div>

          <button type="submit" class="btn btn-primary-glow w-100 py-2.5 fs-6 mb-4">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
          </button>
        </form>

        <!-- Quick Demo Switcher for fast dev/eval testing -->
        <div class="border-top pt-3 mt-2 text-center" style="border-color: var(--border-glass) !important;">
          <small class="text-muted fw-semibold d-block mb-2 text-uppercase" style="font-size: 0.72rem; letter-spacing: 0.05em;">
            Quick Fill Demo Accounts
          </small>
          <div class="d-flex justify-content-center gap-2 flex-wrap">
            <button type="button" class="btn btn-sm btn-outline-primary" onclick="fillDemo('admin', 'Admin@1234')">
              <i class="bi bi-person-gear"></i> Admin
            </button>
            <button type="button" class="btn btn-sm btn-outline-success" onclick="fillDemo('teacher', 'Teacher@1234')">
              <i class="bi bi-mortarboard"></i> Teacher
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillDemo('student', 'Student@1234')">
              <i class="bi bi-backpack"></i> Student
            </button>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function fillDemo(username, password) {
    document.getElementById('identity').value = username;
    document.getElementById('password').value = password;
  }

  const toggleBtn = document.getElementById('togglePasswordBtn');
  const pwdInput = document.getElementById('password');
  const icon = document.getElementById('togglePasswordIcon');
  if (toggleBtn && pwdInput) {
    toggleBtn.addEventListener('click', () => {
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
      } else {
        pwdInput.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
      }
    });
  }
</script>
{% endblock %}
