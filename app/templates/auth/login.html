{% extends "base.html" %}

{% block title %}Sign In — QR Attendance ERP{% endblock %}

{% block content %}
<div class="container py-4 py-md-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
      
      <!-- Login Card -->
      <div class="glass-card p-4 p-md-5">
        
        <!-- Header -->
        <div class="text-center mb-4">
          <img src="{{ url_for('static', filename='images/logo.png') }}" alt="VSGOI Logo" class="rounded-4 shadow mb-3" style="width: 72px; height: 72px; object-fit: cover; border: 2px solid var(--border-glass);">
          <h2 class="fw-bold brand-font mb-0" style="letter-spacing: 0.04em;">VSGOI</h2>
          <div class="text-primary fw-semibold small mb-1" style="font-size: 0.8rem; letter-spacing: 0.05em;">ATTENDANCE ERP</div>
          <p class="text-muted mb-0" style="font-size: 0.82rem;">Dr. Virendra Swarup Memorial Trust Group of Institutions</p>
        </div>

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
          {{ form.hidden_tag() if form else '' }}

          <div class="mb-3">
            <label for="identity" class="form-label fw-medium text-muted small">Username or Institutional ID</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0 text-muted">
                <i class="bi bi-person"></i>
              </span>
              <input type="text" class="form-control border-start-0 ps-0" id="identity" name="identity" placeholder="e.g. admin or roll number" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label for="password" class="form-label fw-medium text-muted small mb-0">Password</label>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0 text-muted">
                <i class="bi bi-shield-lock"></i>
              </span>
              <input type="password" class="form-control border-start-0 border-end-0 ps-0 font-mono" id="password" name="password" placeholder="••••••••" required>
              <button class="input-group-text bg-transparent border-start-0 text-muted" type="button" id="togglePasswordBtn" title="Show/Hide Password">
                <i class="bi bi-eye" id="togglePasswordIcon"></i>
              </button>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember_me" name="remember_me" value="y">
              <label class="form-check-label small text-muted" for="remember_me">
                Keep me signed in
              </label>
            </div>
            <span class="badge badge-soft-success font-mono" style="font-size: 0.72rem;">
              <span class="pulse-pip pulse-pip-teal me-1"></span>Secure Gateway
            </span>
          </div>

          <button type="submit" class="btn btn-primary-glow w-100 py-2.5 fs-6 mb-3">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
          </button>
        </form>

      </div>

    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const toggleBtn = document.getElementById('togglePasswordBtn');
  const pwdInput = document.getElementById('password');
  const icon = document.getElementById('togglePasswordIcon');
  if (toggleBtn && pwdInput) {
    toggleBtn.addEventListener('click', () => {
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
      } else {
        pwdInput.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
      }
    });
  }
</script>
{% endblock %}
