{% extends "base.html" %}

{% block title %}Take Attendance — {{ institution_name }}{% endblock %}

{% block extra_head %}
<meta http-equiv="refresh" content="0; url={{ url_for('attendance.take_attendance') }}">
{% endblock %}

{% block content %}
<div class="container-fluid p-0 text-center py-5">
  <div class="spinner-border text-primary mb-3" role="status"></div>
  <h4>Redirecting to Take Attendance...</h4>
  <p class="text-muted">If you are not redirected automatically, <a href="{{ url_for('attendance.take_attendance') }}">click here</a>.</p>
</div>
<script>
  window.location.replace("{{ url_for('attendance.take_attendance') }}");
</script>
{% endblock %}
